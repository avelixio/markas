name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check
        run: bun run check

      - name: Package and start the program
        run: |
          set -euo pipefail
          bun run package linux-x64
          version=$(node -p "require('./package.json').version")
          bun scripts/package-smoke.ts "dist/release/markas-${version}-linux-x64/markas"

  macos:
    name: macOS ${{ matrix.name }}
    # Real Macs: the whole test suite, then the packaged program with the login Keychain,
    # launchd, zsh and the macOS paths that Linux and Windows never reach.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            runner: macos-15
            target: macos-arm64
          - name: Intel
            runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check
        run: bun run check

      - name: Package and start the program
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bun run package "$TARGET"
          version=$(node -p "require('./package.json').version")
          bun scripts/package-smoke.ts "dist/release/markas-${version}-${TARGET}/markas"

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The engine tests use POSIX shell scripts as fake CLIs.
      - name: Run Windows checks
        run: bun run lint && bun run typecheck && bunx vitest run src/host src/backend/cli.test.ts src/backend/agent-service.fake-client.test.ts && bun run build
